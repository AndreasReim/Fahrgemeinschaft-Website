<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Fahrgemeinschaft</title>
    <script>
      sessionStorage.setItem(
        'redirect',
        location.pathname + location.search + location.hash,
      )
      const parts = location.pathname.split('/').filter(Boolean)
      const repo = parts[0] ? '/' + parts[0] + '/' : '/'
      location.replace(repo)
    </script>
  </head>
  <body></body>
</html>
